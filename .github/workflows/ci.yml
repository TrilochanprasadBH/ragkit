name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage tests (reference passes, stubs fail, shared modules identical)
        run: python scripts/status.py
      - name: Documented numbers match a live run
        run: python evals/check_docs.py
